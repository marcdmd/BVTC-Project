<label for="customer-name"><span>*</span> Customer Name:</label>
<select class="input" 
        name="customer-id" 
        id="customer-name"
        hx-get="{% url 'load_shipping' %}" 
        hx-target="#shipping-address-select" 
        hx-trigger="change">
    <option value="" disabled selected>Select Customer</option>
    {% for customer in customers %}
    <option value="{{ customer.customer_id }}">{{ customer.customer_name }}</option>
    {% endfor %}
</select>
